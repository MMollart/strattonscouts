name = "strattonscouts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Default / local development bindings
# Development and production use ISOLATED Cloudflare resources (AC27).
# Database IDs below are placeholders; replace with your own after running:
#   wrangler d1 create strattonscouts-dev
#   wrangler d1 create strattonscouts-prod
#   wrangler r2 bucket create strattonscouts-resources-dev
#   wrangler r2 bucket create strattonscouts-resources-prod
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "strattonscouts-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "strattonscouts-resources-dev"

[vars]
ENVIRONMENT = "development"
APP_BASE_URL = "http://localhost:5173"

# ---------------------------------------------------------------------------
# Production environment
# ---------------------------------------------------------------------------
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "strattonscouts-prod"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "strattonscouts-resources-prod"

[env.production.vars]
ENVIRONMENT = "production"
APP_BASE_URL = "https://strattonscouts.pages.dev"
