name = "strattonscouts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ---------------------------------------------------------------------------
# Default / local development bindings
# Development and production use ISOLATED Cloudflare resources (AC27).
# The D1 databases already exist (created 2026-10-15). The R2 buckets still need
# creating once R2 is enabled on the account:
#   wrangler r2 bucket create strattonscouts-resources-dev
#   wrangler r2 bucket create strattonscouts-resources-prod
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "strattonscouts-dev"
database_id = "1349588d-ad18-42ba-9b7c-160b0d9843bd"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "strattonscouts-resources-dev"

[vars]
ENVIRONMENT = "development"
APP_BASE_URL = "http://localhost:5173"

# ---------------------------------------------------------------------------
# Production environment
# ---------------------------------------------------------------------------
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "strattonscouts-prod"
database_id = "bed80acb-3def-477d-9a47-8130031a5593"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "strattonscouts-resources-prod"

[env.production.vars]
ENVIRONMENT = "production"
APP_BASE_URL = "https://strattonscouts.pages.dev"
